# Project Foundation Configuration

# Command to initialize project foundation
command: "/catalyze-project"

# Generated files
generated_files:
  mission.md: "Project vision and goals"
  roadmap.md: "Development phases"
  tech-stack.md: "Technology decisions"

# Git Configuration
git:
  # Base branch for spec development (checkout from this branch)
  # Common names: "development", "develop", "staging", "testing", "pre-prod"
  # This is set during /catalyze-project based on user preference
  development_branch: "development"

  # Branch prefix for spec feature branches
  # Example: "feat" creates branches like "feat/2026-01-11-supabase-auth"
  branch_prefix: "feat"

  # Protected branches (cannot commit directly)
  protected_branches:
    - "main"
    - "master"

  # Path for git worktrees (relative to repo root, used by /forge-spec-worktree)
  worktree_path: ".catalyst/worktrees"

  # Commit message templates
  commit_templates:
    red_phase: "test({scope}): write failing tests for {spec}"
    green_phase: "feat({scope}): implement {spec}"

# Voice meetings (/meet-spec) — optional.
# See .catalyst/voice/README.md for setup.
voice:
  enabled: false            # set true to enable /meet-spec
  language: "en"            # meeting/conversation language (e.g. "tr"); artifacts stay English

  # mode: diy = browser speech + local `claude -p` brain. FREE, no API key, needs Chrome.
  #       bundled = ElevenLabs Conversational AI. Nicer voice, per-minute cost (BYOK).
  mode: diy

  # --- bundled mode only (ignored in diy) ---
  # The ElevenLabs API key does NOT go here — it lives in .catalyst/secrets.local.yaml.
  provider: elevenlabs
  voice_id: ""              # optional ElevenLabs voice id
  agent_id: ""              # ElevenLabs Conversational AI agent id

