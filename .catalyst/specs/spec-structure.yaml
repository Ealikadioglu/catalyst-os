# Spec Folder Structure
# Single source of truth - all agents and commands reference this file

version: 3

folder_pattern: ".catalyst/specs/YYYY-MM-DD-{slug}/"

files:
  spec.md:
    owner: scribe
    purpose: Requirements + frontmatter (context assembly metadata)
    created: catalyze-spec
    updated_by: [scribe, arbiter]
    note: |
      Frontmatter enables cross-spec context assembly.
      Body contains requirements, each with GIVEN/WHEN/THEN AC scenarios
      (AC-n, numbered across the spec). Rules: spec-shaping "Requirement Rules".
      Optional `plan: <absolute path>` records the plan file of a --from run.

  research.md:
    owner: scribe
    purpose: All research findings (append-only)
    created: catalyze-spec
    updated_by: [scribe]
    pattern: append
    note: |
      SCRIBE IS THE ONLY WRITER. Seer, Scout, Oracle and Surveyor return
      findings in their response; Scribe compiles. A researcher that writes
      its own file produces a research-{agent}.md nothing downstream reads,
      and it stays on disk forever.
      A finding the spec does not act on is cut, not archived.

  tasks.md:
    owner: forger            # forge-master in direct mode
    purpose: DAG + progress + decisions + session context (THE living doc)
    created: forge-spec
    updated_by: [forger, forge-master, builders]
    pattern: living
    note: |
      ONE FILE to read when resuming work.
      A STATE TABLE, not a diary: status enum + <=200-char note per task,
      one-line decisions. It is re-read by every agent on most turns, so
      every word is paid for dozens of times. Narrative -> journal/.
      No file-level word cap. A big spec earns a big DAG. It does not earn
      rationale, attempts, or abandoned approaches. The per-section shapes
      are the budget: one row per task, one line per decision.
      Line 1 declares the lane: "> Lane: direct — ..." or "> Lane: full DAG — ...".

  journal/:
    owner: builders
    purpose: Per-task narrative — what was tried, what failed, why it changed
    created: forge-spec (as tasks complete)
    updated_by: [smith, shaper, artificer, alchemist, necromancer, enforcer, forge-master]
    pattern: append
    file_pattern: ".catalyst/specs/{spec-slug}/journal/{task-id}.md"
    note: |
      Written by the agent doing the task. Nobody reads another task's
      journal during the build; the orchestrator never reads it.
      The AUDIT reads it (arbiter, inquisitor). That is what it is for.

  handoff.md:
    owner: scribe
    purpose: Human-readable summary (colleague walkthrough)
    created: catalyze-spec (--from: Autopilot Decisions) or forge-spec (started), audit-spec (finalized)
    updated_by: [scribe, arbiter]
    pattern: narrative
    note: |
      Written like explaining to a colleague. 5 minutes to read, not 50.
      Answers three questions and nothing else: where are we, what is left
      before merge, what should someone picking this up know.
      NOT an inventory of changed files. `git diff --stat` already lists
      those and nobody reads that list twice. See handoff_template.

  validation.md:
    owner: arbiter
    purpose: Test results, quality checks
    created: audit-spec
    updated_by: [arbiter]
    note: |
      ARBITER IS THE ONLY WRITER. The five Guardians return findings in their
      response; Arbiter compiles. A validation-{guardian}.md on disk is a
      report nothing reads: the audit is over by the time it exists, and
      /seal-spec reads validation.md.

  assets/:
    owner: any
    purpose: Images, diagrams, mockups
    created: as-needed

# =============================================================================
# PROJECT PATHS
# Outside the spec folder. Listed here so agents route material instead of
# refusing it, and so Scribe's allowlist stays an allowlist.
# =============================================================================

project_paths:
  .catalyst/references/:
    owner: human
    purpose: External material the specs point at — design files, HTML mockups,
             PDFs, vendor docs, competitor output
    created: by hand, never by a command
    note: |
      Project-level and shared across specs. Agents read it and cite paths
      into it; they never generate it.
      Not `.catalyst/specs/references/`, and never inside a spec folder.
      A spec cites `.catalyst/references/{name}` the same way it cites a
      source file.

statuses:
  - DRAFT
  - IN_PROGRESS
  - VALIDATING
  - COMPLETE

rules:
  - spec.md has frontmatter for context assembly
  - tasks.md is THE living document during build — state only, never rationale
  - journal/{task}.md holds the narrative; the build never reads it, the audit does
  - handoff.md is human-first, no heavy YAML
  - One file to resume = tasks.md
  - Every task row carries an Evidence tier (rg | mut); default rg

# =============================================================================
# SPEC.MD SCHEMA
# Requirements + frontmatter for context assembly
# =============================================================================

spec_schema:
  frontmatter:
    required:
      spec: string          # YYYY-MM-DD-slug
      status: enum          # draft | in_progress | validating | complete
      domain: string        # auth, payments, ui, api, database, etc.

    context_assembly:
      provides:             # What this spec creates
        - type: string
      requires:             # Dependencies on other specs
        - spec: string
          needed: string
      affects:              # What future work this impacts
        - type: string

    knowledge:
      patterns_established: # Technical decisions (filled during/after build)
        - type: string
      key_files:            # Important files created
        - type: string
      key_decisions:        # Strategic choices with rationale
        - type: string

    sync:
      foundation_synced: date  # Set by /sync-project once this spec's changes are reconciled into .catalyst/main/

  example: |
    ---
    spec: 2025-01-11-user-auth
    status: complete
    domain: auth

    provides:
      - User model with password hashing
      - JWT middleware
      - Login/signup endpoints

    requires: []

    affects:
      - All routes needing auth
      - User-related features

    patterns_established:
      - argon2 for password hashing (not bcrypt)
      - jose library for JWT
      - httpOnly cookies for tokens

    key_files:
      - src/middleware/auth.ts
      - src/api/auth/login.ts

    key_decisions:
      - JWT over sessions (stateless scaling)
    ---

    # User Authentication

    ## Overview
    ...requirements here...

# =============================================================================
# TASKS.MD SCHEMA
# The ONE file to read when resuming - DAG + progress + decisions + context
# =============================================================================

tasks_schema:
  sections:
    - "## Build DAG"           # Task breakdown with phases
    - "## Progress"            # Status table
    - "## Current Session"     # Where we are, what's next
    - "## Decisions"           # Decisions made during build

  example: |
    # Tasks: User Authentication

    ## Build DAG

    ### Phase 1: Red (enforcer)
    | ID | Agent | Scope | Depends On |
    |----|-------|-------|------------|
    | tests-auth | enforcer | tests/api/auth/** | - |

    ### Phase 2: Foundation (alchemist)
    | ID | Agent | Scope | Depends On |
    |----|-------|-------|------------|
    | db-schema | alchemist | prisma/schema.prisma | tests-auth |

    ### Phase 3: Parallel Backend (smith × 2)
    | ID | Agent | Scope | Reads | Depends On |
    |----|-------|-------|-------|------------|
    | api-auth | smith-1 | src/api/auth/** | src/types/** | db-schema |
    | api-user | smith-2 | src/api/user/** | src/types/** | db-schema |

    ## Progress

    | Task | Status | Tests | Commit | Notes |
    |------|--------|-------|--------|-------|
    | tests-auth | ✓ Done | 12 failing | a1b2c3d | RED phase complete |
    | db-schema | ✓ Done | 12 passing | e4f5g6h | |
    | api-auth | ⚡ Active | 8/12 | - | Refresh rotation next; see journal/api-auth.md |
    | api-user | ⏳ Waiting | - | - | Blocked by api-auth |

    ## Current Session

    **Phase:** 3 - Parallel Backend
    **Active:** api-auth (smith-1)
    **Working on:** Refresh token rotation
    **File:** `src/api/auth/refresh.ts:45`
    **Next:** Finish refresh, then api-user can start

    ## Decisions

    - **JWT over sessions** - Stateless for horizontal scaling
    - **15-min access token** - Balance security vs UX
    - **argon2 over bcrypt** - Better GPU resistance

# =============================================================================
# HANDOFF.MD TEMPLATE
# Human-readable - colleague explaining over coffee
# =============================================================================

# handoff.md answers three questions. The shape below is the whole file.
# The voice rules matter more than the headings: a section list invites an
# inventory, which is the failure this template replaces.

handoff_voice:
  - No inventory. Never list changed files, new exports, or function names.
    Say what the system can do now that it could not before.
  - Plain words over identifiers. "The importer used to parse the whole file
    before validating anything" beats "parse.ts gained streamValidate".
  - First person, with judgment. You did the work, so rank it: say which
    single item is a must. A handoff with no ranking makes the reader rank.
  - Only counts that carry a decision. File count, test count, "no migration"
    tell the reader what to expect. Line deltas, REQ/AC totals and commit
    SHAs do not; they are in the diff and in tasks.md.
  - Gotchas as advice, with the reason it bit you. Not "port 5200 may be in
    use" but "check what is on port 5200 before trusting an e2e result, a
    stale dev server from another branch can take over silently".
  - No frontmatter and no metadata blockquote. Status goes in the first
    sentence; branch and commits are in git.

handoff_template: |
  # {Feature} — where we are

  {Two or three paragraphs. First: the status, and what a person can now do
  that they could not before. Second: the change that carries the most
  weight, which is usually not the visible one, plus any decision you
  reversed. Then the shape of the work in the few counts that mean
  something.}

  ## Before merge

  {What is left. Name the one item you would call a must and say the rest
  are non-blocking. Prose, not checkboxes.}

  ## Worth knowing if you pick this up

  {The traps, each as advice a colleague would give, with the reason.}

handoff_example: |
  # Bulk import — where we are

  Bulk import is built and has passed its audit (pass, no concerns). Someone
  can now upload a CSV of up to 50,000 rows, see which rows will fail before
  anything is committed, fix them in place, and import the rest. A run that
  fails halfway leaves nothing behind, so retrying is safe.

  The load-bearing change is not the upload screen. The importer used to parse
  a whole file into memory before validating anything, which is why large
  files timed out instead of reporting errors. It now streams and validates
  row by row, and that is what makes the preview possible at all. I reversed
  an earlier decision here: validation runs on the server as well as the
  client, because the client check turned out to be bypassable with a
  hand-made request. Scope: 23 files, 412 unit tests passing, one migration.

  ## Before merge

  One real upload against a production-sized file. My evidence comes from a
  5,000-row fixture, and the timeout this feature exists to fix only appears
  above roughly 20,000 rows. This is the only item I would call a must.

  Two spec corrections are open and the error copy has had no reviewer but
  me. Neither blocks.

  ## Worth knowing if you pick this up

  The preview and the commit share one validator on purpose. Change a rule in
  one and not the other and the preview will promise an import that then
  fails. No test catches that today.

  Row numbers in error messages are 1-based to match what the user sees in a
  spreadsheet, while the parser is 0-based. The offset is applied once, at the
  boundary. Move it and every error shifts by one row, silently.

# =============================================================================
# CONTEXT ASSEMBLY
# =============================================================================

context_assembly:
  source: spec.md  # Read frontmatter from spec.md

  on_new_spec:
    - Scan .catalyst/specs/*/spec.md
    - Parse YAML frontmatter only
    - Match by: new spec domain vs existing "affects"
    - Load: patterns_established, key_files, key_decisions
    - Inject into agent prompts

  on_resume:
    - Read tasks.md "## Current Session" section
    - Continue from recorded position

# =============================================================================
# BUILD DAG STRUCTURE
# Used by Forger to create task breakdown
# =============================================================================

build_dag:
  phases:
    foundation:
      agent: alchemist
      sequential: true
      description: "Database schema, core setup"

    contracts:
      agent: smith
      sequential: true
      description: "Shared types/interfaces before parallel work"

    parallel:
      agents: [smith, shaper]
      multi_instance: true
      description: "Scope-isolated parallel implementation"
      rules:
        - "Each agent has exclusive write scope"
        - "Agents can read but not modify shared files"
        - "No overlapping scopes between parallel tasks"

    integration:
      agent: enforcer
      sequential: true
      description: "Cross-boundary testing"

  lanes:
    direct:
      when: "<= 3 production files, no migration, no parallel units, one builder domain"
      builder: forge-master   # orchestrator builds; no forger/enforcer/parallel phase
      tasks_md: "<= 5 rows, no phases"
    full:
      when: "anything else"
      builder: forger + enforcer + parallel builders

  task_fields:
    - id          # Unique identifier
    - agent       # Which agent type (with instance: smith-1, shaper-2)
    - scope       # Files with exclusive write access
    - reads       # Files with read-only access
    - depends_on  # Task IDs that must complete first
    - blocks      # Task patterns this blocks (e.g., api-*, ui-*)
    - acceptance  # How to verify completion (one line)
    - evidence    # rg (red-then-green, default) | mut (mutation-prove: named invariant / security boundary / load-bearing req)
    - estimate    # Time estimate (< 2 hours)

# =============================================================================
# PATTERN LIBRARY
# Reusable patterns extracted from completed specs
# =============================================================================

library:
  root: "library/"
  description: "Reusable patterns extracted from completed specs"
  created_by: "/seal-spec (optional)"

  # Auto-detect patterns by keywords
  pattern_detection:
    payment-integration.md:
      keywords: [stripe, payment, billing, subscription, checkout]
    authentication.md:
      keywords: [auth, oauth, login, sso, jwt, session]
    file-storage.md:
      keywords: [upload, s3, storage, file, media, image]
    real-time-communication.md:
      keywords: [websocket, realtime, socket, live, push]
    notifications.md:
      keywords: [email, notification, smtp, push, alert]
    search-implementation.md:
      keywords: [search, elasticsearch, algolia, fulltext]
    caching-strategy.md:
      keywords: [cache, redis, memcached, performance]
    background-jobs.md:
      keywords: [queue, job, worker, bull, async, cron]

# =============================================================================
# COMPLETED SPECS
# =============================================================================

completed:
  location: "completed/"
  description: "Specs moved here after /seal-spec"
